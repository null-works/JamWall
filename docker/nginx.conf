server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # PHP API
    location ~ ^/api/.*\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_PASSWORD $http_x_password;
        fastcgi_param HTTP_X_PLAYER $http_x_player;
    }

    # Block direct access to db files
    location ~ /\.  { deny all; }
    location ~* \.(sqlite|sql)$ { deny all; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|json|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
