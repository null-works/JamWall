<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a26"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Vinyl record -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="40" fill="url(#accent)"/>
  <circle cx="256" cy="256" r="12" fill="#0a0a0f"/>
  <!-- Grooves hint -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.15"/>
</svg>
