<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JamWall</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a26;
            --bg-card-hover: #22222f;
            --bg-input: #15151f;
            --border: #2a2a3a;
            --border-focus: #6c5ce7;
            --text-primary: #eeeef0;
            --text-secondary: #8888a0;
            --text-muted: #555568;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --accent-secondary: #e84393;
            --green: #00b894;
            --orange: #fdcb6e;
            --red: #d63031;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --radius: 12px;
            --radius-sm: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --backdrop: rgba(10, 10, 15, 0.85);
            --backdrop-heavy: rgba(10, 10, 15, 0.9);
            --backdrop-np: rgba(12, 12, 18, 0.95);
            --overlay: rgba(0, 0, 0, 0.7);
            --shadow-toast: rgba(0, 0, 0, 0.4);
            --playing-bg: rgba(108, 92, 231, 0.06);
            --vote-bg: rgba(108, 92, 231, 0.04);
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #eeeef2;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --bg-input: #f0f0f5;
            --border: #d5d5dd;
            --border-focus: #6c5ce7;
            --text-primary: #1a1a2e;
            --text-secondary: #6b6b80;
            --text-muted: #9898a8;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.2);
            --accent-secondary: #e84393;
            --green: #00a884;
            --orange: #e6a700;
            --red: #d63031;
            --backdrop: rgba(245, 245, 247, 0.9);
            --backdrop-heavy: rgba(245, 245, 247, 0.95);
            --backdrop-np: rgba(255, 255, 255, 0.95);
            --overlay: rgba(0, 0, 0, 0.4);
            --shadow-toast: rgba(0, 0, 0, 0.1);
            --playing-bg: rgba(108, 92, 231, 0.08);
            --vote-bg: rgba(108, 92, 231, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-display);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* === LAYOUT === */
        .app { min-height: 100dvh; display: flex; flex-direction: column; }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            padding: calc(var(--safe-top) + 12px) 20px 12px;
            background: var(--backdrop);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .topbar-back { 
            background: none; border: none; color: var(--text-secondary); 
            font-size: 20px; cursor: pointer; padding: 4px 8px;
            display: none;
        }
        .topbar-back.visible { display: block; }
        .topbar h1 {
            font-size: 18px; font-weight: 700; flex: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .topbar-player {
            font-family: var(--font-mono); font-size: 12px;
            color: var(--text-secondary); padding: 4px 10px;
            border: 1px solid var(--border); border-radius: 20px;
        }

        .content {
            flex: 1; padding: 20px 20px calc(var(--safe-bottom) + 130px);
            max-width: 640px; margin: 0 auto; width: 100%;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            padding: 8px 20px calc(var(--safe-bottom) + 8px);
            background: var(--backdrop-heavy);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: center; gap: 8px;
        }
        .nav-btn {
            flex: 1; max-width: 120px;
            background: none; border: none; color: var(--text-muted);
            font-family: var(--font-display); font-size: 11px; font-weight: 500;
            padding: 8px 12px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: color 0.2s;
        }
        .nav-btn svg { width: 22px; height: 22px; }
        .nav-btn.active { color: var(--accent); }

        /* === SCREENS === */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === LOGIN SCREEN === */
        .login-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100dvh; padding: 40px 24px;
            text-align: center;
        }
        .login-logo {
            font-size: 48px; font-weight: 800; letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .login-form {
            margin-top: 40px;
            width: 100%; max-width: 320px;
            display: flex; flex-direction: column; gap: 12px;
        }

        /* === INPUTS === */
        input[type="text"], input[type="password"], input[type="url"],
        input[type="datetime-local"], textarea, select {
            width: 100%; padding: 14px 16px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary);
            font-family: var(--font-display); font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        textarea { resize: vertical; min-height: 80px; }
        ::placeholder { color: var(--text-muted); }

        /* === BUTTONS === */
        .btn {
            padding: 14px 24px; border: none; border-radius: var(--radius-sm);
            font-family: var(--font-display); font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .btn-primary:hover { background: linear-gradient(135deg, #5a4bd4, #7c4ddb); transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary {
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }
        .btn-danger { background: var(--red); color: white; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* === CARDS === */
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px;
            margin-bottom: 12px; cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .card:hover { background: var(--bg-card-hover); border-color: var(--accent); }
        .card-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .card-meta {
            display: flex; gap: 16px; font-size: 12px;
            font-family: var(--font-mono); color: var(--text-muted);
        }

        /* === PHASE BADGES === */
        .phase-badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .phase-submitting { background: rgba(108, 92, 231, 0.15); color: var(--accent); }
        .phase-voting { background: rgba(253, 203, 110, 0.15); color: var(--orange); }
        .phase-results { background: rgba(0, 184, 148, 0.15); color: var(--green); }

        /* === SECTION HEADERS === */
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 22px; font-weight: 700;
        }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state-text { font-size: 14px; }

        /* === SUBMISSION ROW === */
        .sub-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 8px;
            overflow: hidden; transition: background 0.2s, border-color 0.2s;
        }
        .sub-card:hover { background: var(--bg-card-hover); }
        .sub-card.playing {
            border-color: var(--accent);
            background: var(--playing-bg);
        }
        .sub-card.own-sub { opacity: 0.5; }
        .sub-card-row {
            display: flex; align-items: center;
            gap: 12px; padding: 10px 14px;
        }
        .sub-card-art {
            width: 48px; height: 48px; border-radius: 6px;
            overflow: hidden; flex-shrink: 0;
            position: relative; cursor: pointer;
        }
        .sub-card-art img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .sub-card-art .art-play {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0; transition: opacity 0.2s;
        }
        .sub-card-art:hover .art-play { opacity: 1; }
        .sub-card.playing .sub-card-art .art-play {
            opacity: 1; background: rgba(108, 92, 231, 0.6);
        }
        .art-play svg { width: 18px; height: 18px; fill: white; }
        .sub-card-info { flex: 1; min-width: 0; }
        .sub-card-title {
            font-size: 14px; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .sub-card-title.loading { color: var(--text-muted); font-size: 12px; }
        .sub-card-player {
            font-size: 12px; color: var(--accent); font-weight: 600;
        }
        .sub-card-comment {
            font-size: 11px; color: var(--text-secondary);
            font-style: italic;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 1px;
        }
        .sub-card-details { padding: 0 14px 10px; }

        /* === NOW PLAYING BAR === */
        .now-playing {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 72px);
            left: 0; right: 0; z-index: 101;
            background: var(--backdrop-np);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--accent);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 -4px 20px rgba(108, 92, 231, 0.15);
            display: none;
        }
        .now-playing.active { display: block; }
        .np-progress {
            height: 3px; background: var(--bg-input); cursor: pointer;
        }
        .np-progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            transition: width 0.2s linear;
        }
        .np-inner {
            display: flex; align-items: center;
            gap: 10px; padding: 8px 16px;
            max-width: 640px; margin: 0 auto;
        }
        .np-art {
            width: 40px; height: 40px; border-radius: 4px;
            object-fit: cover; flex-shrink: 0;
        }
        .np-info { flex: 1; min-width: 0; }
        .np-title {
            font-size: 12px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .np-player { font-size: 11px; color: var(--accent); }
        .np-status {
            font-size: 10px; color: var(--orange);
            font-family: var(--font-mono);
        }
        .np-controls { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .np-btn {
            background: none; border: none;
            color: var(--text-secondary);
            cursor: pointer; padding: 4px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .np-btn svg { width: 18px; height: 18px; }
        .np-btn:hover { color: var(--text-primary); }
        .np-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .np-canvas {
            flex-shrink: 0; border-radius: 2px;
        }
        .np-close {
            background: none; border: none;
            color: var(--text-muted); font-size: 20px;
            cursor: pointer; padding: 4px 8px; flex-shrink: 0;
            transition: color 0.2s;
        }
        .np-close:hover { color: var(--text-primary); }

        /* === VOTE CONTROLS (compact) === */
        .vote-row {
            display: flex; align-items: center; gap: 6px;
            flex-shrink: 0;
        }
        .vote-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .vote-btn:hover:not(:disabled) {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .vote-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .vote-btn.vote-minus { color: var(--accent-secondary); }
        .vote-btn.vote-plus { color: var(--accent); }
        .vote-count {
            font-family: var(--font-mono); font-size: 15px;
            font-weight: 700; min-width: 20px; text-align: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .vote-points-remaining {
            font-family: var(--font-mono); font-size: 13px;
            color: var(--text-secondary); text-align: center;
            padding: 12px; margin-bottom: 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--vote-bg);
        }
        .vote-points-remaining strong {
            color: var(--accent); font-size: 20px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* === RESULTS === */
        .result-rank {
            font-family: var(--font-mono); font-size: 14px;
            font-weight: 700; color: var(--text-muted);
            min-width: 28px; flex-shrink: 0; text-align: center;
        }
        .result-rank-1 { color: #ffd700; }
        .result-rank-2 { color: #c0c0c0; }
        .result-rank-3 { color: #cd7f32; }
        .result-points {
            font-family: var(--font-mono); font-size: 16px;
            font-weight: 700; color: var(--accent); flex-shrink: 0;
        }
        .result-bar {
            height: 4px; background: var(--bg-input);
            border-radius: 2px; overflow: hidden;
        }
        .result-bar-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            transition: width 0.6s ease;
        }

        /* === LEADERBOARD === */
        .lb-row {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 20px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 8px;
        }
        .lb-rank {
            font-family: var(--font-mono); font-size: 20px;
            font-weight: 700; color: var(--text-muted);
            min-width: 30px;
        }
        .lb-rank-1 { color: #ffd700; }
        .lb-rank-2 { color: #c0c0c0; }
        .lb-rank-3 { color: #cd7f32; }
        .lb-name { flex: 1; font-weight: 600; font-size: 16px; }
        .lb-points {
            font-family: var(--font-mono); font-size: 18px;
            font-weight: 700; color: var(--accent);
        }
        .lb-meta { font-size: 11px; color: var(--text-muted); }

        /* === MODAL === */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: var(--overlay); backdrop-filter: blur(8px);
            display: none; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary); border-radius: 20px 20px 0 0;
            width: 100%; max-width: 640px;
            max-height: 85dvh; overflow-y: auto;
            padding: 24px 20px calc(var(--safe-bottom) + 24px);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-handle {
            width: 40px; height: 4px; border-radius: 2px;
            background: var(--border); margin: 0 auto 20px;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* === COMMENTS SECTION === */
        .comments-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .comment-item {
            padding: 8px 0; font-size: 13px;
        }
        .comment-author { font-weight: 600; color: var(--accent); }
        .comment-text { color: var(--text-secondary); margin-top: 2px; }
        .comment-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .comment-input-row input { flex: 1; padding: 10px 12px; font-size: 13px; }

        /* === TOAST === */
        .toast-container {
            position: fixed; top: calc(var(--safe-top) + 70px);
            left: 50%; transform: translateX(-50%); z-index: 300;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 12px 20px; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500;
            background: var(--bg-card); border: 1px solid var(--border);
            box-shadow: 0 8px 30px var(--shadow-toast);
            animation: toastIn 0.3s ease;
            white-space: nowrap;
        }
        .toast-error { border-color: var(--red); color: var(--red); }
        .toast-success { border-color: var(--green); color: var(--green); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === COUNTDOWN === */
        .countdown {
            font-family: var(--font-mono); font-size: 13px;
            color: var(--text-muted);
        }

        /* === LOADING === */
        .spinner {
            width: 24px; height: 24px; border: 2px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === THEME TOGGLE === */
        .theme-toggle {
            background: none; border: none; color: var(--text-secondary);
            font-size: 18px; cursor: pointer; padding: 4px 8px;
            transition: color 0.2s;
            display: flex; align-items: center;
        }
        .theme-toggle:hover { color: var(--text-primary); }
        .theme-toggle svg { width: 20px; height: 20px; }

        /* === HIDDEN UTILITY === */
        .hidden { display: none !important; }

        /* === DEBUG TAB === */
        .debug-entry {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px;
            margin-bottom: 8px; font-size: 13px;
        }
        .debug-entry-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .debug-id {
            font-family: var(--font-mono); font-size: 12px;
            color: var(--text-secondary);
        }
        .debug-status {
            display: inline-block; padding: 2px 8px;
            border-radius: 10px; font-size: 11px; font-weight: 600;
            text-transform: uppercase;
        }
        .debug-status-ready { background: rgba(0,184,148,0.15); color: var(--green); }
        .debug-status-converting { background: rgba(253,203,110,0.15); color: var(--orange); }
        .debug-status-failed { background: rgba(214,48,49,0.15); color: var(--red); }
        .debug-status-stale_lock { background: rgba(214,48,49,0.15); color: var(--red); }
        .debug-meta {
            font-family: var(--font-mono); font-size: 11px;
            color: var(--text-muted); margin-bottom: 6px;
        }
        .debug-actions { display: flex; gap: 8px; margin-top: 8px; }
        .debug-log {
            margin-top: 10px; padding: 10px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-size: 11px;
            color: var(--text-secondary); white-space: pre-wrap;
            word-break: break-all; max-height: 300px; overflow-y: auto;
        }
        .debug-disk {
            font-family: var(--font-mono); font-size: 12px;
            color: var(--text-muted); text-align: center;
            padding: 8px; margin-bottom: 12px;
        }
    </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="login-screen">
    <div class="login-logo">JAM<br>WALL</div>
    <div class="login-form">
        <input type="password" id="passwordInput" placeholder="Enter league password" autocomplete="off">

<div class="toast-container" id="toasts"></div>

<script>
// ===== STATE =====
let state = {
    password: '',
    player: '',
    currentRound: null,
    votes: {},        // { submissionId: points }
    screen: 'rounds',
    history: []
};

const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '/api' : '/api';

// ===== API HELPERS =====
async function api(endpoint, method = 'GET', body = null) {
    const opts = {
        method,
        headers: {
            'Content-Type': 'application/json',
            'X-Password': state.password,
            'X-Player': state.player
        }
    };
    if (body) opts.body = JSON.stringify(body);
    
    const res = await fetch(`${API}/${endpoint}`, opts);
    const data = await res.json();
    
    if (!res.ok) {
        throw new Error(data.error || 'Request failed');
    }
    return data;
}

// ===== AUTH =====
function handleLogin() {
    const pwInput = document.getElementById('passwordInput');
    const nameInput = document.getElementById('nameInput');
    
    if (nameInput.classList.contains('hidden')) {
        // Step 1: Validate password
        const pw = pwInput.value.trim();
        if (!pw) { toast('Enter the password', 'error'); return; }
        
        state.password = pw;
        
        // Test password
        fetch(`${API}/auth.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                toast('Wrong password', 'error');
                state.password = '';
                return;
            }
            // Password OK — ask for name
            pwInput.classList.add('hidden');
            nameInput.classList.remove('hidden');
            nameInput.focus();
            document.getElementById('loginBtn').textContent = 'Join';
            
            // Restore name from session
            const saved = sessionStorage.getItem('jw_player');
            if (saved) nameInput.value = saved;
        })
        .catch(() => toast('Connection error', 'error'));
        return;
    }
    
    // Step 2: Set name
    const name = nameInput.value.trim();
    if (!name) { toast('Pick a display name', 'error'); return; }
    if (name.length > 20) { toast('Name too long (max 20 chars)', 'error'); return; }
    
    state.player = name;
    sessionStorage.setItem('jw_password', state.password);
    sessionStorage.setItem('jw_player', state.player);
    
    // Enter app
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('topbarPlayer').textContent = state.player;
    
    loadRounds();
}

// Restore session on load
(function restoreSession() {
    const pw = sessionStorage.getItem('jw_password');
    const player = sessionStorage.getItem('jw_player');
    if (pw && player) {
        state.password = pw;
        state.player = player;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('topbarPlayer').textContent = state.player;
        loadRounds();
    }
    
    // Enter key support
    document.getElementById('passwordInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('nameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });
})();

// ===== NAVIGATION =====
function switchTab(tab) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    const screenMap = { rounds: 'roundsScreen', leaderboard: 'leaderboardScreen', debug: 'debugScreen' };
    const titleMap = { rounds: 'JamWall', leaderboard: 'Standings', debug: 'Debug' };
    document.getElementById(screenMap[tab]).classList.add('active');

    document.querySelector(`[data-screen="${tab}"]`).classList.add('active');
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('topbarTitle').textContent = titleMap[tab] || 'JamWall';

    state.screen = tab;
    state.history = [];
    if (tab !== 'debug') stopPlayback();

    if (tab === 'leaderboard') loadLeaderboard();
    if (tab === 'rounds') loadRounds();
    if (tab === 'debug') loadDebug();
}

function goBack() {
    stopPlayback();
    document.getElementById('roundDetail').classList.remove('active');
    document.getElementById('roundsScreen').classList.add('active');
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('topbarTitle').textContent = 'JamWall';
    state.currentRound = null;
}

// ===== ROUNDS =====
async function loadRounds() {
    const container = document.getElementById('roundsList');
    container.innerHTML = '<div class="spinner"></div>';
    
    try {
        const rounds = await api('rounds.php');
        
        if (rounds.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎵</div>
                    <div class="empty-state-text">No rounds yet — create one to get started!</div>
                </div>`;
            return;
        }
        
        container.innerHTML = rounds.map(r => `
            <div class="card" onclick="openRound(${r.id})">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
                    <span class="phase-badge phase-${r.phase}">${r.phase}</span>
                    <span class="countdown">${getCountdown(r)}</span>
                </div>
                <div class="card-title">${esc(r.title)}</div>
                ${r.description ? `<div class="card-desc">${esc(r.description)}</div>` : ''}
                <div class="card-meta">
                    <span>🎵 ${r.submission_count} submissions</span>
                    <span>🗳️ ${r.voter_count} voted</span>
                </div>
            </div>
        `).join('');
        
    } catch (e) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-text">Error: ${esc(e.message)}</div></div>`;
    }
}

function getCountdown(round) {
    const now = new Date();
    let target, label;
    
    if (round.phase === 'submitting') {
        target = new Date(round.submission_deadline);
        label = 'Submit by';
    } else if (round.phase === 'voting') {
        target = new Date(round.voting_deadline);
        label = 'Vote by';
    } else {
        return 'Complete';
    }
    
    const diff = target - now;
    if (diff < 0) return 'Ended';
    
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    
    if (days > 0) return `${label} ${days}d ${hours}h`;
    if (hours > 0) return `${label} ${hours}h ${mins}m`;
    return `${label} ${mins}m`;
}

// ===== ROUND DETAIL =====
async function openRound(id) {
    state.currentRound = id;
    
    document.getElementById('roundsScreen').classList.remove('active');
    document.getElementById('roundDetail').classList.add('active');
    document.getElementById('backBtn').classList.add('visible');
    
    const container = document.getElementById('roundDetailContent');
    container.innerHTML = '<div class="spinner"></div>';
    
    try {
        const data = await api(`submissions.php?round_id=${id}`);
        const round = data.round;
        const phase = data.phase;
        const subs = data.submissions;
        
        document.getElementById('topbarTitle').textContent = round.title;
        
        let html = '';
        
        // Round info
        html += `
            <div style="margin-bottom:24px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <span class="phase-badge phase-${phase}">${phase}</span>
                    <span class="countdown">${getCountdown({...round, phase})}</span>
                </div>
                ${round.description ? `<p style="color:var(--text-secondary);font-size:14px;margin-top:8px">${esc(round.description)}</p>` : ''}
            </div>
        `;
        
        // Phase-specific UI
        if (phase === 'submitting') {
            const mySubmission = subs.find(s => s.player_name === state.player);
            html += `
                <button class="btn btn-primary" style="width:100%;margin-bottom:24px" onclick="showSubmitSong()">
                    ${mySubmission ? '🔄 Change Your Submission' : '🎵 Submit a Song'}
                </button>
            `;
            if (mySubmission) {
                html += `
                    <div class="sub-card" data-player="Your submission">
                        <div class="sub-card-row">
                            <div class="sub-card-art" onclick="playTrack('${esc(mySubmission.youtube_id)}', this)">
                                <img src="https://img.youtube.com/vi/${esc(mySubmission.youtube_id)}/hqdefault.jpg" alt="">
                                <div class="art-play"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></div>
                            </div>
                            <div class="sub-card-info">
                                <div class="sub-card-title loading" data-ytid="${esc(mySubmission.youtube_id)}">Loading title...</div>
                                <div class="sub-card-player">Your submission</div>
                                ${mySubmission.comment ? `<div class="sub-card-comment">"${esc(mySubmission.comment)}"</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            html += `<p style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:16px">${subs.length} submission${subs.length !== 1 ? 's' : ''} so far</p>`;
        }
        
        else if (phase === 'voting') {
            // Init vote state
            state.votes = {};
            const maxPoints = round.vote_points;
            
            // Check for existing votes
            subs.forEach(s => {
                const myVote = s.votes.find(v => v.voter_name === state.player);
                if (myVote) state.votes[s.id] = myVote.points;
            });
            
            html += `
                <div class="vote-points-remaining">
                    Points remaining: <strong id="voteRemaining">${maxPoints - Object.values(state.votes).reduce((a,b) => a+b, 0)}</strong> / ${maxPoints}
                </div>
            `;
            
            // Shuffle submissions for fairness (seeded by round id)
            const shuffled = [...subs].sort(() => 0.5 - seededRandom(id));
            
            html += shuffled.map(s => {
                const isOwn = s.player_name === state.player;
                return `
                    <div class="sub-card ${isOwn ? 'own-sub' : ''}" data-player="${esc(s.player_name)}">
                        <div class="sub-card-row">
                            <div class="sub-card-art" onclick="playTrack('${esc(s.youtube_id)}', this)">
                                <img src="https://img.youtube.com/vi/${esc(s.youtube_id)}/hqdefault.jpg" alt="">
                                <div class="art-play"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></div>
                            </div>
                            <div class="sub-card-info">
                                <div class="sub-card-title loading" data-ytid="${esc(s.youtube_id)}">Loading title...</div>
                                <div class="sub-card-player">${esc(s.player_name)}</div>
                                ${s.comment ? `<div class="sub-card-comment">"${esc(s.comment)}"</div>` : ''}
                            </div>
                            ${isOwn ? '' : `
                                <div class="vote-row">
                                    <button class="vote-btn vote-minus" onclick="adjustVote(${s.id}, -1, ${maxPoints})" ${!state.votes[s.id] ? 'disabled' : ''}>−</button>
                                    <span class="vote-count" id="vc-${s.id}">${state.votes[s.id] || 0}</span>
                                    <button class="vote-btn vote-plus" onclick="adjustVote(${s.id}, 1, ${maxPoints})">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
            
            html += `<button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="submitVotes()">Submit Votes</button>`;
        }
        
        else if (phase === 'results') {
            const maxPoints = subs.length > 0 ? Math.max(...subs.map(s => s.total_points), 1) : 1;
            
            html += subs.map((s, i) => `
                <div class="sub-card" data-player="${esc(s.player_name)}">
                    <div class="sub-card-row">
                        <div class="result-rank ${i < 3 ? 'result-rank-' + (i + 1) : ''}">#${i + 1}</div>
                        <div class="sub-card-art" onclick="playTrack('${esc(s.youtube_id)}', this)">
                            <img src="https://img.youtube.com/vi/${esc(s.youtube_id)}/hqdefault.jpg" alt="">
                            <div class="art-play"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></div>
                        </div>
                        <div class="sub-card-info">
                            <div class="sub-card-title loading" data-ytid="${esc(s.youtube_id)}">Loading title...</div>
                            <div class="sub-card-player">${esc(s.player_name)}</div>
                            ${s.comment ? `<div class="sub-card-comment">"${esc(s.comment)}"</div>` : ''}
                        </div>
                        <div class="result-points">${s.total_points}</div>
                    </div>
                    <div class="sub-card-details">
                        <div class="result-bar">
                            <div class="result-bar-fill" style="width:${(s.total_points / maxPoints) * 100}%"></div>
                        </div>
                        ${renderComments(s)}
                    </div>
                </div>
            `).join('');
        }
        
        container.innerHTML = html;
        loadVideoTitles();

    } catch (e) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-text">Error: ${esc(e.message)}</div></div>`;
    }
}

// ===== VOTING =====
function adjustVote(subId, delta, maxPoints) {
    const current = state.votes[subId] || 0;
    const newVal = current + delta;
    
    if (newVal < 0) return;
    
    const totalUsed = Object.entries(state.votes)
        .filter(([id]) => parseInt(id) !== subId)
        .reduce((sum, [, pts]) => sum + pts, 0);
    
    if (totalUsed + newVal > maxPoints) {
        toast('No points remaining!', 'error');
        return;
    }
    
    state.votes[subId] = newVal;
    
    document.getElementById(`vc-${subId}`).textContent = newVal;
    document.getElementById('voteRemaining').textContent = maxPoints - totalUsed - newVal;
    
    // Update button states
    const minusBtn = document.querySelector(`[onclick="adjustVote(${subId}, -1, ${maxPoints})"]`);
    if (minusBtn) minusBtn.disabled = newVal <= 0;
}

async function submitVotes() {
    const votes = Object.entries(state.votes)
        .filter(([, pts]) => pts > 0)
        .map(([id, pts]) => ({ submission_id: parseInt(id), points: pts }));
    
    if (votes.length === 0) {
        toast('Distribute some points first!', 'error');
        return;
    }
    
    try {
        await api('votes.php', 'POST', {
            round_id: state.currentRound,
            votes
        });
        toast('Votes submitted! 🗳️', 'success');
    } catch (e) {
        toast(e.message, 'error');
    }
}

// ===== COMMENTS =====
function renderComments(submission) {
    const comments = submission.comments || [];
    return `
        <div class="comments-section">
            ${comments.map(c => `
                <div class="comment-item">
                    <span class="comment-author">${esc(c.player_name)}</span>
                    <div class="comment-text">${esc(c.comment)}</div>
                </div>
            `).join('')}
            <div class="comment-input-row">
                <input type="text" id="comment-${submission.id}" placeholder="Add a comment...">
                <button class="btn btn-sm btn-secondary" onclick="postComment(${submission.id})">Post</button>
            </div>
        </div>
    `;
}

async function postComment(subId) {
    const input = document.getElementById(`comment-${subId}`);
    const text = input.value.trim();
    if (!text) return;
    
    try {
        await api('comments.php', 'POST', {
            submission_id: subId,
            comment: text
        });
        input.value = '';
        openRound(state.currentRound); // Refresh
    } catch (e) {
        toast(e.message, 'error');
    }
}

// ===== SUBMISSION =====
function showSubmitSong() {
    openModal('submitSongModal');
    document.getElementById('songUrl').value = '';
    document.getElementById('songComment').value = '';
    document.getElementById('songPreview').classList.add('hidden');
    
    // Live preview
    document.getElementById('songUrl').addEventListener('input', function() {
        const id = extractYouTubeId(this.value);
        const preview = document.getElementById('songPreview');
        if (id) {
            preview.innerHTML = `
                <div class="sub-card" style="margin:0">
                    <div class="sub-card-row">
                        <div class="sub-card-art">
                            <img src="https://img.youtube.com/vi/${esc(id)}/hqdefault.jpg" alt="">
                        </div>
                        <div class="sub-card-info">
                            <div class="sub-card-title loading" data-ytid="${esc(id)}">Loading title...</div>
                        </div>
                    </div>
                </div>`;
            preview.classList.remove('hidden');
            loadVideoTitles();
        } else {
            preview.classList.add('hidden');
        }
    });
}

// ===== AUDIO PLAYER (Web Audio API) =====
let currentlyPlaying = null;
let playlist = [];  // [{ ytId, playerName }] — built from visible sub-cards
let playlistIndex = -1;
let audioEl = null;
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let animFrameId = null;
let audioReady = {}; // { ytId: url } — cache of ready audio URLs

function initAudio() {
    if (audioEl) return;
    audioEl = new Audio();
    // No crossOrigin needed — audio is same-origin, and setting it
    // forces a CORS preflight that fails if server headers are missing
    audioEl.addEventListener('ended', () => {
        if (playlist.length > 0) { playNext(); } else { stopPlayback(); }
    });
    audioEl.addEventListener('timeupdate', () => {
        if (audioEl.duration) {
            const pct = (audioEl.currentTime / audioEl.duration) * 100;
            document.getElementById('npProgress').style.width = pct + '%';
        }
    });
    audioEl.addEventListener('play', () => {
        document.getElementById('npIconPlay').classList.add('hidden');
        document.getElementById('npIconPause').classList.remove('hidden');
        showNpStatus('');
    });
    audioEl.addEventListener('pause', () => {
        document.getElementById('npIconPlay').classList.remove('hidden');
        document.getElementById('npIconPause').classList.add('hidden');
    });
    audioEl.addEventListener('error', () => {
        const err = audioEl.error;
        const codes = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
        const msg = `Audio error: ${codes[err?.code] || err?.code || 'unknown'} — ${err?.message || 'no details'}`;
        console.error(msg, err);
        showNpStatus(msg);
    });
    audioEl.addEventListener('stalled', () => {
        console.warn('Audio stalled');
        showNpStatus('Audio stalled — buffering...');
    });
    audioEl.addEventListener('waiting', () => {
        showNpStatus('Buffering...');
    });
    audioEl.addEventListener('canplay', () => {
        if (!audioEl.paused) showNpStatus('');
    });
}

function showNpStatus(msg) {
    const el = document.getElementById('npStatus');
    if (msg) {
        el.textContent = msg;
        el.classList.remove('hidden');
    } else {
        el.classList.add('hidden');
    }
}

function initAudioContext() {
    if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
}

function buildPlaylist(currentYtId) {
    // Scrape all playable sub-cards on screen
    const cards = document.querySelectorAll('.sub-card[data-player] .sub-card-art[onclick]');
    playlist = [];
    cards.forEach(art => {
        const match = art.getAttribute('onclick')?.match(/playTrack\('([^']+)'/);
        if (match) {
            const card = art.closest('.sub-card');
            playlist.push({ ytId: match[1], playerName: card?.dataset?.player || '' });
        }
    });
    playlistIndex = playlist.findIndex(t => t.ytId === currentYtId);
    updatePrevNextButtons();
}

function updatePrevNextButtons() {
    const prevBtn = document.getElementById('npPrev');
    const nextBtn = document.getElementById('npNext');
    if (prevBtn) prevBtn.disabled = playlist.length === 0 || playlistIndex <= 0;
    if (nextBtn) nextBtn.disabled = playlist.length === 0 || playlistIndex >= playlist.length - 1;
}

function playTrack(ytId, el) {
    initAudio();

    const card = el?.closest('.sub-card');
    const playerName = card?.dataset?.player || '';

    // If same track, toggle play/pause
    if (currentlyPlaying === ytId && audioEl.src) {
        togglePlayPause();
        return;
    }

    // Build playlist from visible cards
    buildPlaylist(ytId);

    // Stop current visualization and reset peaks
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    vizPeaks = []; vizPrevValues = []; vizParticles = [];

    // Highlight row
    document.querySelectorAll('.sub-card.playing').forEach(c => c.classList.remove('playing'));
    if (card) card.classList.add('playing');

    // Show now-playing bar
    document.getElementById('nowPlaying').classList.add('active');
    document.getElementById('npProgress').style.width = '0%';

    // Set info
    document.getElementById('npTitle').textContent = videoTitleCache[ytId] || 'Loading...';
    document.getElementById('npPlayer').textContent = playerName;
    document.getElementById('npArt').src = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;

    // Clear status
    const statusEl = document.getElementById('npStatus');
    statusEl.classList.add('hidden');
    statusEl.textContent = '';

    // Clear canvas
    const canvas = document.getElementById('npCanvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

    currentlyPlaying = ytId;

    // Fetch title if not cached
    if (!videoTitleCache[ytId]) {
        fetchVideoTitle(ytId).then(t => {
            if (t && currentlyPlaying === ytId) {
                document.getElementById('npTitle').textContent = t;
            }
        });
    }

    // Check if audio is already known ready
    if (audioReady[ytId]) {
        playAudioFile(audioReady[ytId]);
        return;
    }

    // Show preparing status and poll
    statusEl.textContent = 'Preparing audio...';
    statusEl.classList.remove('hidden');
    pollAudio(ytId);
}

async function pollAudio(ytId) {
    if (currentlyPlaying !== ytId) return;

    try {
        const data = await api(`audio.php?id=${ytId}`);
        if (data.status === 'ready') {
            audioReady[ytId] = data.url;
            if (currentlyPlaying === ytId) {
                document.getElementById('npStatus').classList.add('hidden');
                playAudioFile(data.url);
            }
        } else if (data.status === 'failed') {
            document.getElementById('npStatus').textContent = 'Conversion failed — check Debug tab';
            document.getElementById('npStatus').classList.remove('hidden');
        } else {
            document.getElementById('npStatus').textContent = 'Converting...';
            document.getElementById('npStatus').classList.remove('hidden');
            setTimeout(() => pollAudio(ytId), 2000);
        }
    } catch (e) {
        document.getElementById('npStatus').textContent = 'Error loading audio';
        document.getElementById('npStatus').classList.remove('hidden');
    }
}

function playAudioFile(url) {
    console.log('[JamWall] Playing audio:', url);
    // Like jcink_audio: set src and play first, visualization is optional
    audioEl.src = url;
    audioEl.play().then(() => {
        console.log('[JamWall] Playback started, duration:', audioEl.duration);
        // Only init Web Audio API after playback succeeds
        try {
            initAudioContext();
            startVisualization();
        } catch (e) {
            console.warn('[JamWall] Visualization failed (playback unaffected):', e);
        }
    }).catch(err => {
        console.error('[JamWall] Play failed:', err);
        showNpStatus('Play failed: ' + err.message);
    });
}

// Visualizer state
let vizPeaks = [];
let vizPrevValues = [];
let vizParticles = []; // sparkle particle pool

function startVisualization() {
    if (!analyser) return;
    const canvas = document.getElementById('npCanvas');
    const ctx = canvas.getContext('2d');

    // Retina support
    const dpr = window.devicePixelRatio || 1;
    const cssW = 150, cssH = 40;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.scale(dpr, dpr);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    const barCount = 28;
    const gap = 1.5;
    const barWidth = (cssW - (barCount - 1) * gap) / barCount;
    const midY = cssH / 2;

    // Init state arrays
    if (vizPeaks.length !== barCount) {
        vizPeaks = new Array(barCount).fill(0);
        vizPrevValues = new Array(barCount).fill(0);
    }

    // Sparkle colors (white, pink, purple, gold)
    const sparkleColors = [
        [255, 255, 255],
        [232, 67, 147],
        [168, 85, 247],
        [253, 203, 110],
    ];

    function spawnSparkles(x, y, intensity) {
        const count = Math.floor(intensity * 3) + 1;
        for (let s = 0; s < count; s++) {
            if (vizParticles.length > 80) break; // cap particle count
            const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
            vizParticles.push({
                x: x + Math.random() * barWidth,
                y: y,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -(Math.random() * 1.2 + 0.3),
                life: 1.0,
                decay: 0.02 + Math.random() * 0.03,
                size: Math.random() * 2 + 0.5,
                r: color[0], g: color[1], b: color[2],
                twinkle: Math.random() * Math.PI * 2, // phase offset for shimmer
            });
        }
    }

    // Pre-build gradients
    const barGradUp = ctx.createLinearGradient(0, midY, 0, 0);
    barGradUp.addColorStop(0, '#6c5ce7');
    barGradUp.addColorStop(0.6, '#a855f7');
    barGradUp.addColorStop(1, '#e84393');
    const barGradDown = ctx.createLinearGradient(0, midY, 0, cssH);
    barGradDown.addColorStop(0, 'rgba(108,92,231,0.5)');
    barGradDown.addColorStop(1, 'rgba(108,92,231,0.05)');

    let frameCount = 0;

    function draw() {
        animFrameId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        frameCount++;

        ctx.clearRect(0, 0, cssW, cssH);

        for (let i = 0; i < barCount; i++) {
            // Frequency bin averaging
            let sum = 0, count = 0;
            const startBin = Math.floor((i / barCount) * bufferLength * 0.8);
            const endBin = Math.floor(((i + 1) / barCount) * bufferLength * 0.8);
            for (let j = startBin; j < endBin && j < bufferLength; j++) {
                sum += dataArray[j];
                count++;
            }
            const raw = count > 0 ? sum / count : 0;

            // Smooth: snappy attack, slow decay
            const val = raw > vizPrevValues[i]
                ? raw * 0.7 + vizPrevValues[i] * 0.3
                : raw * 0.3 + vizPrevValues[i] * 0.7;
            vizPrevValues[i] = val;

            const norm = val / 255;
            const barH = norm * (midY - 2);
            const x = i * (barWidth + gap);

            if (barH < 0.5) {
                ctx.fillStyle = 'rgba(108,92,231,0.3)';
                ctx.fillRect(x, midY - 0.5, barWidth, 1);
                vizPeaks[i] = Math.max(0, vizPeaks[i] - 0.4);
                continue;
            }

            // Main bars (mirrored from center)
            ctx.fillStyle = barGradUp;
            ctx.fillRect(x, midY - barH, barWidth, barH);

            // Reflection (lower half, faded)
            ctx.fillStyle = barGradDown;
            ctx.fillRect(x, midY + 1, barWidth, barH * 0.6);

            // Glow on loud bars
            if (norm > 0.5) {
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = norm * 8;
                ctx.fillStyle = 'rgba(168,85,247,0.15)';
                ctx.fillRect(x, midY - barH, barWidth, barH);
                ctx.shadowBlur = 0;
            }

            // Peak indicators
            const prevPeak = vizPeaks[i];
            if (barH > vizPeaks[i]) {
                vizPeaks[i] = barH;
                // Spawn sparkles when a bar hits a new peak (energy burst)
                if (barH - prevPeak > 2 && norm > 0.4) {
                    spawnSparkles(x, midY - barH, norm);
                }
            } else {
                vizPeaks[i] = Math.max(0, vizPeaks[i] - 0.35);
            }

            if (vizPeaks[i] > 1) {
                const peakY = midY - vizPeaks[i];
                const peakBrightness = 0.6 + (vizPeaks[i] / midY) * 0.4;
                ctx.fillStyle = `rgba(255,255,255,${peakBrightness})`;
                ctx.fillRect(x, peakY - 1.5, barWidth, 1.5);
            }

            // Ambient sparkles on hot bars (occasional)
            if (norm > 0.65 && Math.random() < 0.15) {
                spawnSparkles(x, midY - barH * Math.random(), norm * 0.5);
            }
        }

        // Center line
        ctx.fillStyle = 'rgba(108,92,231,0.2)';
        ctx.fillRect(0, midY, cssW, 0.5);

        // === PARTICLES / SPARKLES ===
        ctx.save();
        for (let p = vizParticles.length - 1; p >= 0; p--) {
            const pt = vizParticles[p];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vy += 0.02; // gentle gravity
            pt.life -= pt.decay;

            if (pt.life <= 0 || pt.y > cssH || pt.y < -2 || pt.x < -2 || pt.x > cssW + 2) {
                vizParticles.splice(p, 1);
                continue;
            }

            // Twinkle: oscillate alpha for a shimmer effect
            const twinkle = 0.5 + 0.5 * Math.sin(frameCount * 0.3 + pt.twinkle);
            const alpha = pt.life * twinkle;

            // Draw sparkle: bright center dot + soft glow
            const sz = pt.size * (0.5 + pt.life * 0.5);
            ctx.shadowColor = `rgba(${pt.r},${pt.g},${pt.b},${alpha * 0.8})`;
            ctx.shadowBlur = sz * 3;
            ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${alpha})`;

            // Diamond/star shape for sparkles
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y - sz);
            ctx.lineTo(pt.x + sz * 0.5, pt.y);
            ctx.lineTo(pt.x, pt.y + sz);
            ctx.lineTo(pt.x - sz * 0.5, pt.y);
            ctx.closePath();
            ctx.fill();

            // Cross sparkle on brighter particles
            if (alpha > 0.5 && sz > 1) {
                ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.4})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(pt.x - sz * 1.2, pt.y);
                ctx.lineTo(pt.x + sz * 1.2, pt.y);
                ctx.moveTo(pt.x, pt.y - sz * 1.2);
                ctx.lineTo(pt.x, pt.y + sz * 1.2);
                ctx.stroke();
            }
        }
        ctx.shadowBlur = 0;
        ctx.restore();
    }
    draw();
}

function togglePlayPause() {
    if (!audioEl) return;
    if (audioEl.paused) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audioEl.play().catch(err => {
            console.error('[JamWall] Resume failed:', err);
            showNpStatus('Resume failed: ' + err.message);
        });
        if (analyser) startVisualization();
    } else {
        audioEl.pause();
        if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    }
}

function playNext() {
    if (playlist.length === 0 || playlistIndex >= playlist.length - 1) return;
    playlistIndex++;
    const track = playlist[playlistIndex];
    // Find the matching sub-card art element to pass context
    const arts = document.querySelectorAll('.sub-card-art[onclick]');
    let targetEl = null;
    arts.forEach(art => {
        if (art.getAttribute('onclick')?.includes(track.ytId)) targetEl = art;
    });
    // Reset currentlyPlaying so playTrack doesn't just toggle
    currentlyPlaying = null;
    playTrack(track.ytId, targetEl);
}

function playPrev() {
    if (playlist.length === 0 || playlistIndex <= 0) return;
    playlistIndex--;
    const track = playlist[playlistIndex];
    const arts = document.querySelectorAll('.sub-card-art[onclick]');
    let targetEl = null;
    arts.forEach(art => {
        if (art.getAttribute('onclick')?.includes(track.ytId)) targetEl = art;
    });
    currentlyPlaying = null;
    playTrack(track.ytId, targetEl);
}

function seekAudio(e) {
    if (!audioEl || !audioEl.duration) return;
    const bar = e.currentTarget;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = pct * audioEl.duration;
}

function stopPlayback() {
    if (audioEl) { audioEl.pause(); audioEl.src = ''; }
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    vizPeaks = []; vizPrevValues = []; vizParticles = [];
    document.getElementById('nowPlaying').classList.remove('active');
    document.getElementById('npProgress').style.width = '0%';
    const canvas = document.getElementById('npCanvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    document.querySelectorAll('.sub-card.playing').forEach(c => c.classList.remove('playing'));
    currentlyPlaying = null;
    playlist = [];
    playlistIndex = -1;
}

// ===== DEBUG =====
async function loadDebug() {
    const container = document.getElementById('debugContent');
    container.innerHTML = '<div class="spinner"></div>';

    try {
        const data = await api('debug.php?action=status');
        let html = '';

        html += `<div class="debug-disk">Disk: ${esc(data.disk_usage)}</div>`;

        if (data.entries.length === 0) {
            html += `<div class="empty-state"><div class="empty-state-text">No conversions yet</div></div>`;
        } else {
            html += data.entries.map(e => {
                const thumb = `https://img.youtube.com/vi/${esc(e.youtube_id)}/default.jpg`;
                const sizeStr = e.mp3_size ? `${(e.mp3_size / 1024 / 1024).toFixed(1)}MB` : '—';
                const durStr = e.duration ? `${Math.floor(e.duration / 60)}:${String(Math.floor(e.duration % 60)).padStart(2, '0')}` : '—';
                return `
                    <div class="debug-entry" id="debug-${esc(e.youtube_id)}">
                        <div class="debug-entry-header">
                            <div style="display:flex;align-items:center;gap:8px">
                                <img src="${thumb}" style="width:32px;height:24px;border-radius:3px;object-fit:cover">
                                <span class="debug-id">${esc(e.youtube_id)}</span>
                            </div>
                            <span class="debug-status debug-status-${esc(e.status)}">${esc(e.status)}</span>
                        </div>
                        <div class="debug-meta">
                            Size: ${sizeStr} &nbsp;|&nbsp; Duration: ${durStr}
                            ${e.error ? ` &nbsp;|&nbsp; Error: ${esc(e.error)}` : ''}
                            ${e.lock_age_seconds ? ` &nbsp;|&nbsp; Lock age: ${e.lock_age_seconds}s` : ''}
                        </div>
                        <div class="debug-actions">
                            ${e.has_log ? `<button class="btn btn-secondary btn-sm" onclick="viewLog('${esc(e.youtube_id)}')">View Log</button>` : ''}
                            ${e.mp3_exists ? `<button class="btn btn-secondary btn-sm" onclick="testPlay('${esc(e.youtube_id)}')">Test Play</button>` : ''}
                            <button class="btn btn-secondary btn-sm" onclick="retryConversion('${esc(e.youtube_id)}')">Retry</button>
                        </div>
                        <div class="debug-log hidden" id="log-${esc(e.youtube_id)}"></div>
                    </div>
                `;
            }).join('');
        }

        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-text">Error: ${esc(e.message)}</div></div>`;
    }
}

async function viewLog(ytId) {
    const logEl = document.getElementById(`log-${ytId}`);
    if (!logEl.classList.contains('hidden')) {
        logEl.classList.add('hidden');
        return;
    }
    logEl.textContent = 'Loading...';
    logEl.classList.remove('hidden');

    try {
        const data = await api(`debug.php?action=log&id=${ytId}`);
        logEl.textContent = data.log || '(empty log)';
        logEl.scrollTop = logEl.scrollHeight;
    } catch (e) {
        logEl.textContent = 'Error loading log: ' + e.message;
    }
}

async function retryConversion(ytId) {
    try {
        await api(`debug.php?action=retry&id=${ytId}`);
        toast('Retrying conversion...', 'success');
        delete audioReady[ytId];
        setTimeout(loadDebug, 2000);
    } catch (e) {
        toast('Retry failed: ' + e.message, 'error');
    }
}

async function retryAll() {
    if (!confirm('This will delete ALL converted audio and re-download. Continue?')) return;
    try {
        const data = await api('debug.php?action=retry_all');
        toast(`Retrying ${data.count} conversions...`, 'success');
        audioReady = {};
        setTimeout(loadDebug, 3000);
    } catch (e) {
        toast('Retry all failed: ' + e.message, 'error');
    }
}

function testPlay(ytId) {
    // Direct test: try to load and play the audio file, show errors in debug
    initAudio();
    initAudioContext();
    const url = `/audio/${ytId}.mp3`;
    const logEl = document.getElementById(`log-${ytId}`);
    logEl.classList.remove('hidden');
    logEl.textContent = `Testing playback of ${url}...\n`;

    const addLog = (msg) => { logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`; logEl.scrollTop = logEl.scrollHeight; };

    // Test with fetch first to check HTTP response
    fetch(url).then(res => {
        addLog(`HTTP ${res.status} ${res.statusText}`);
        addLog(`Content-Type: ${res.headers.get('content-type')}`);
        addLog(`Content-Length: ${res.headers.get('content-length')}`);
        addLog(`CORS: ${res.headers.get('access-control-allow-origin') || 'none'}`);
        return res.blob();
    }).then(blob => {
        addLog(`Blob size: ${blob.size} bytes, type: ${blob.type}`);
        addLog('Setting audio.src and calling play()...');
        audioEl.src = url;
        audioEl.load();

        const onError = () => {
            const err = audioEl.error;
            const codes = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
            addLog(`ERROR: ${codes[err?.code] || err?.code} — ${err?.message || 'no message'}`);
        };
        const onCanPlay = () => {
            addLog(`canplay — duration: ${audioEl.duration}s`);
            audioEl.play().then(() => addLog('Playing!')).catch(e => addLog(`play() rejected: ${e.message}`));
            audioEl.removeEventListener('canplay', onCanPlay);
        };
        const onTimeUpdate = () => {
            addLog(`timeupdate — position: ${audioEl.currentTime.toFixed(1)}s / ${audioEl.duration.toFixed(1)}s`);
            audioEl.removeEventListener('timeupdate', onTimeUpdate);
        };

        audioEl.addEventListener('error', onError, { once: true });
        audioEl.addEventListener('canplay', onCanPlay);
        audioEl.addEventListener('timeupdate', onTimeUpdate);
    }).catch(e => {
        addLog(`Fetch error: ${e.message}`);
    });
}

// ===== VIDEO TITLES =====
const videoTitleCache = {};

async function fetchVideoTitle(ytId) {
    if (videoTitleCache[ytId]) return videoTitleCache[ytId];
    try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
        const data = await res.json();
        const title = data.title || 'Untitled';
        videoTitleCache[ytId] = title;
        return title;
    } catch {
        return null;
    }
}

async function loadVideoTitles() {
    const els = document.querySelectorAll('[data-ytid]');
    const ids = [...new Set([...els].map(el => el.dataset.ytid))];
    await Promise.all(ids.map(async id => {
        const title = await fetchVideoTitle(id);
        if (title) {
            document.querySelectorAll(`[data-ytid="${id}"]`).forEach(el => {
                el.textContent = title;
                el.classList.remove('loading');
            });
        }
    }));
}

// ===== UTILITIES =====
function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function extractYouTubeId(url) {
    const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|music\.youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : null;
}

function seededRandom(seed) {
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

function toLocalISO(date) {
    const offset = date.getTimezoneOffset();
    const local = new Date(date.getTime() - offset * 60000);
    return local.toISOString().slice(0, 16);
}

function openModal(id) {
    document.getElementById(id).classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function toast(msg, type = 'info') {
    const container = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = `toast ${type === 'error' ? 'toast-error' : type === 'success' ? 'toast-success' : ''}`;
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
        if (e.target === overlay) overlay.classList.remove('active');
    });
});

// ===== THEME =====
function applyTheme(theme) {
    if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.querySelector('meta[name="theme-color"]').content = '#f5f5f7';
        document.getElementById('themeIconSun').classList.add('hidden');
        document.getElementById('themeIconMoon').classList.remove('hidden');
    } else {
        document.documentElement.removeAttribute('data-theme');
        document.querySelector('meta[name="theme-color"]').content = '#0a0a0f';
        document.getElementById('themeIconSun').classList.remove('hidden');
        document.getElementById('themeIconMoon').classList.add('hidden');
    }
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    localStorage.setItem('jw_theme', next);
    applyTheme(next);
}

// Restore saved theme on load
(function restoreTheme() {
    const saved = localStorage.getItem('jw_theme');
    if (saved) applyTheme(saved);
})();

// Register service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
